<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dompet - WafaStoreOnly x Killua</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#060a23;color:#fff;padding-bottom:90px}
.header{padding:12px 16px;background:rgba(8,12,37,0.9);backdrop-filter:blur(12px);display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:50;border-bottom:2px solid #00e5ff40}
.card{margin:16px;background:linear-gradient(135deg,#00c6ff,#7c3aed);border-radius:20px;padding:20px;box-shadow:0 0 25px #00e5ff80}
.btn{width:100%;background:#fff;color:#000;border:none;padding:12px;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.m{background:#121631;border:1px solid #2a3a8a;border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,37,0.97);display:flex;justify-content:space-around;padding:8px 0 10px;border-top:1px solid #1e2450}
.nav{font-size:9px;color:#5a638a;text-align:center;flex:1;cursor:pointer}.nav.active{color:#00d4ff}
</style>
</head>
<body>
<div class="header"><a href="index.html" style="color:#00e5ff;text-decoration:none;font-weight:800">← Kembali</a><b style="margin-left:10px">Dompet Saya ⚡</b></div>
<div class="card">
<div style="font-size:11px;opacity:0.8">Saldo WafaStoreOnly x Killua</div>
<h1 id="saldo" style="font-family:'Bebas Neue';font-size:42px;margin:8px 0">Rp 0</h1>
<div id="email" style="font-size:11px">Loading...</div>
<button class="btn" onclick="window.open('https://wa.me/6283862776790','_blank')">+ TOP UP SALDO VIA WA</button>
</div>
<div class="menu">
<div class="m" onclick="window.location.href='index.html'"><div style="font-size:26px">⚡</div><div style="font-size:11px;font-weight:800;margin-top:6px">Top Up Game</div></div>
<div class="m" onclick="window.location.href='pesanan.html'"><div style="font-size:26px">📦</div><div style="font-size:11px;font-weight:800;margin-top:6px">Riwayat Order</div></div>
</div>
<div class="bottom">
<div class="nav" onclick="window.location.href='index.html'">🏠<br>Beranda</div>
<div class="nav" onclick="window.location.href='index.html'">⚡<br>Top Up</div>
<div class="nav" onclick="window.location.href='pesanan.html'">☰<br>Pesanan</div>
<div class="nav active" onclick="window.location.href='dompet.html'">👛<br>Dompet</div>
<div class="nav" onclick="window.location.href='profil.html'">👤<br>Profil</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDTkQVpME0XRQmk9Jo7eDQuf0OFY8stm_8", authDomain: "wafastoreonly.firebaseapp.com", databaseURL: "https://wafastoreonly-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "wafastoreonly", appId: "1:208012194307:web:551a540b0151333da69436" };
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);
onAuthStateChanged(auth,(u)=>{
  if(!u){location.href='login.html';return}
  document.getElementById('email').innerText=u.email;
  onValue(ref(db,'users/'+u.uid+'/saldo'),(s)=>{
    document.getElementById('saldo').innerText='Rp '+(s.val()||0).toLocaleString('id-ID');
  });
});
</script>
</body>
</html>
