<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dompet - WafaStoreOnly</title>
<style>
body{background:#060a23;color:#fff;font-family:Inter;padding-bottom:90px;margin:0}
.header{padding:12px 16px;background:rgba(8,12,37,0.9);display:flex;gap:10px;align-items:center;position:sticky;top:0;border-bottom:2px solid #00e5ff40}
.card{margin:16px;background:linear-gradient(135deg,#00c6ff,#7c3aed);border-radius:20px;padding:20px;box-shadow:0 0 25px #00e5ff80}
.btn{width:100%;background:#fff;color:#000;border:none;padding:12px;border-radius:12px;font-weight:900;margin-top:12px}
.item{background:#121631;border:1px solid #2a3a8a;border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="header"><a href="index.html" style="color:#00e5ff;text-decoration:none">← Kembali</a><b> Dompet Saya ⚡</b></div>
<div class="card">
<div style="font-size:12px;opacity:0.8">Saldo WafaStoreOnly x Killua</div>
<h1 id="saldo" style="font-size:36px;margin:8px 0">Rp 0</h1>
<div id="email" style="font-size:11px">Loading...</div>
<button class="btn" onclick="alert('Top Up Saldo hubungi Admin - Transfer ke DANA 083862776790')">+ TOP UP SALDO</button>
</div>
<div style="padding:16px">
<div style="font-weight:800">Riwayat Saldo</div>
<div class="item"><span>Belum ada transaksi</span><span>-</span></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDTkQVpME0XRQmk9Jo7eDQuf0OFY8stm_8", authDomain: "wafastoreonly.firebaseapp.com", databaseURL: "https://wafastoreonly-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "wafastoreonly", appId: "1:208012194307:web:551a540b0151333da69436" };
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);
onAuthStateChanged(auth,(user)=>{
  if(!user){location.href='login.html';return}
  document.getElementById('email').innerText=user.email;
  onValue(ref(db,'users/'+user.uid+'/saldo'),(s)=>{
    document.getElementById('saldo').innerText='Rp '+(s.val()||0).toLocaleString('id-ID');
  });
});
</script>
</body>
</html>
