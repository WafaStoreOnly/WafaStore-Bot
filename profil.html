<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil - WafaStoreOnly x Killua</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./sidebar.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyDTkQVpME0XRQmk9Jo7eDQuf0OFY8stm_8", authDomain: "wafastoreonly.firebaseapp.com", databaseURL: "https://wafastoreonly-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "wafastoreonly", storageBucket: "wafastoreonly.firebasestorage.app", messagingSenderId: "208012194307", appId: "1:208012194307:web:551a540b0151333da69436" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
window.wafaDB = db; window.wafaRef = ref; window.wafaGet = get; window.wafaUpdate = update; window.wafaSet = set;
window.wafaAuth = auth;
let uid = localStorage.getItem('wafa_uid');
if(!uid){ window.location.href='login.html'; }
onAuthStateChanged(auth, (user)=>{ if(user && !localStorage.getItem('wafa_uid')){ localStorage.setItem('wafa_uid', user.uid); } });
</script>
</head>
<body>
<div id="wsContent">
<div class="ws-section">
  <div style="font-weight:900;font-size:20px">Profil Saya ⚡</div>
  <p style="font-size:11px;color:#aab0d0;margin-top:4px">Kelola data diri & akun kamu</p>

  <div class="ws-card" style="text-align:center">
    <img id="profileBigPic" src="https://ui-avatars.com/api/?name=Wafa&background=00e5ff&color=000" style="width:100px;height:100px;border-radius:50%;border:3px solid #00e5ff;object-fit:cover;box-shadow:0 0 25px #00e5ff80">
    <h2 id="profileBigName" style="margin-top:12px;font-weight:900">Loading...</h2>
    <div id="profileBigEmail" style="font-size:12px;color:#aab0d0">-</div>
    <button class="btn btn-grey" style="margin-top:12px" onclick="document.getElementById('inputFotoAlbum').click()">📸 Ganti Foto dari Album</button>
    <input type="file" id="inputFotoAlbum" accept="image/*" style="display:none" onchange="gantiFotoProfile(this)">
    <div style="font-size:10px;color:#5a638a;margin-top:6px">Foto dari galeri HP kamu, max 2MB</div>
  </div>

  <div class="ws-card">
    <div style="font-weight:800;font-size:14px;margin-bottom:12px">📋 Data Diri (Bisa Diedit)</div>
    <div class="input-group">
      <label>Nama / Nickname</label>
      <input id="bigInputNama" placeholder="Isi nama kamu...">
    </div>
    <div class="input-group">
      <label>Tanggal Lahir</label>
      <input id="bigInputTgl" type="date">
    </div>
    <button class="btn btn-primary" onclick="simpanDataDiri()">💾 Simpan Perubahan</button>
  </div>

  <div class="ws-card">
    <div style="font-weight:800;font-size:14px;margin-bottom:12px">🔒 Data Login (Tidak Bisa Diedit)</div>
    <div class="input-group">
      <label>Email / Gmail</label>
      <div class="locked-input"><input id="lockEmail" disabled value="-"></div>
    </div>
    <div class="input-group">
      <label>Metode Login</label>
      <div class="locked-input"><input id="lockMethod" disabled value="-"></div>
    </div>
    <div class="input-group">
      <label>UID Akun</label>
      <div class="locked-input"><input id="lockUid" disabled value="-"></div>
    </div>
    <div class="input-group">
      <label>Tanggal Daftar</label>
      <div class="locked-input"><input id="lockJoin" disabled value="-"></div>
    </div>
    <div style="font-size:10px;color:#5a638a;margin-top:8px;line-height:1.6">
      ℹ️ Data login terikat ke akun Google kamu dan tidak bisa diubah. Kalau mau ganti akun, pakai tombol <b>Ganti Akun</b> dibawah.
    </div>
  </div>

  <div class="ws-card">
    <div style="font-weight:800;font-size:14px;margin-bottom:8px">⚙️ Kelola Akun</div>
    <button class="btn btn-grey" onclick="gantiAkun()">🔄 Ganti Akun / Login Gmail Lain</button>
    <button class="btn btn-red" onclick="logout()">🚪 Logout Akun</button>
  </div>
</div>
</div>

<script src="./sidebar.js"></script>
<script>
let currentUser = null;

if(typeof wsSetActive==='function') wsSetActive('profil');
if(typeof wsSetTitle==='function') wsSetTitle('👤 Profil Saya');

if(window.wafaAuth){
  window.wafaAuth.onAuthStateChanged(async (user)=>{
    if(!user) return;
    currentUser = user;

    const pic = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName||user.email)}&background=00e5ff&color=000`;
    document.getElementById('profileBigPic').src = pic;
    document.getElementById('profileBigName').innerText = user.displayName || user.email.split('@')[0];
    document.getElementById('profileBigEmail').innerText = user.email;
    document.getElementById('lockEmail').value = user.email;
    document.getElementById('lockUid').value = user.uid;
    document.getElementById('lockJoin').value = user.metadata && user.metadata.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString('id-ID') : '-';

    let metode = 'Email/Password';
    if(user.providerData && user.providerData[0]){
      const p = user.providerData[0].providerId;
      if(p === 'google.com') metode = 'Google (Gmail)';
      else if(p === 'password') metode = 'Email & Password';
      else if(p === 'phone') metode = 'Nomor HP (OTP)';
    }
    document.getElementById('lockMethod').value = metode;

    try{
      if(window.wafaDB && window.wafaGet){
        const snap = await window.wafaGet(window.wafaRef(window.wafaDB, 'users/' + user.uid));
        const d = snap.val();
        if(d){
          if(d.nickname) document.getElementById('bigInputNama').value = d.nickname;
          if(d.birthDate || d.tanggalLahir) document.getElementById('bigInputTgl').value = d.birthDate || d.tanggalLahir;
          if(d.photoBase64){ document.getElementById('profileBigPic').src = d.photoBase64; }
          else if(d.photoURL){ document.getElementById('profileBigPic').src = d.photoURL; }
        }
      }
    }catch(e){ console.log('Load user error:', e); }
  });
}

async function gantiFotoProfile(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ alert('❌ Foto max 2MB ya!'); return; }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const base64 = e.target.result;
    document.getElementById('profileBigPic').src = base64;
    const uid = localStorage.getItem('wafa_uid') || (currentUser && currentUser.uid);
    if(!uid){ alert('UID ga ketemu, login ulang!'); return; }
    try{
      await window.wafaUpdate(window.wafaRef(window.wafaDB, 'users/' + uid), { photoBase64: base64, photoURL: base64 });
      if(typeof wsToast === 'function') wsToast('✅ Foto profil berhasil diganti!');
      else alert('✅ Foto berhasil diganti!');
    }catch(err){ alert('❌ Gagal simpan: '+err.message); }
  };
  reader.readAsDataURL(file);
}

async function simpanDataDiri(){
  const nama = document.getElementById('bigInputNama').value.trim();
  const tgl = document.getElementById('bigInputTgl').value;
  if(!nama){ alert('Isi nama dulu ya!'); return; }
  const uid = localStorage.getItem('wafa_uid') || (currentUser && currentUser.uid);
  if(!uid) return;
  try{
    const payload = { nickname: nama, displayName: nama };
    if(tgl){ payload.birthDate = tgl; payload.tanggalLahir = tgl; }
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'users/' + uid), payload);
    document.getElementById('profileBigName').innerText = nama;
    let curUser = JSON.parse(localStorage.getItem('wafa_user')||'{}');
    curUser.nickname = nama; localStorage.setItem('wafa_user', JSON.stringify(curUser));
    if(typeof wsToast === 'function') wsToast('✅ Data diri berhasil disimpan!');
    else alert('✅ Data diri tersimpan!');
    if(typeof wsLoadUser === 'function') wsLoadUser();
  }catch(e){ alert('❌ Gagal simpan: '+e.message); }
}

function gantiAkun(){
  if(confirm('Mau ganti akun Gmail lain? Kamu akan logout dulu.')){
    logout();
  }
}
function logout(){
  localStorage.removeItem('wafa_uid');
  window.wafaAuth.signOut().then(()=>{ location.href='login.html'; }).catch(()=>{ location.href='login.html'; });
}
</script>
</body>
</html>
