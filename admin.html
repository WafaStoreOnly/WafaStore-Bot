<script>
function sensorEmail(e){if(!e||!e.includes('@'))return'****';let [a,b]=e.split('@');return a.slice(0,3)+'****@'+b}
function sensorUid(u){if(!u)return'****';return u.slice(0,6)+'...'+u.slice(-4)}

// ===== ADMIN CHECK =====
let isAdmin = false;
function showLock(){
  document.getElementById('adminLock').style.display='flex';
  document.getElementById('wsContent').style.display='none';
}
window.wafaAuth.onAuthStateChanged((user)=>{
  console.log('🔐 Auth state:', user ? user.uid : 'not logged in');
  if(user && window.ADMIN_UIDS.includes(user.uid)){
    isAdmin = true;
    initAdmin();
  } else if(user){
    console.log('❌ Bukan admin. UID:', user.uid);
    showLock();
  } else {
    console.log('❌ Belum login');
    showLock();
  }
});

// ===== INIT ADMIN =====
function initAdmin(){
  console.log('✅ Admin logged in:', window.wafaAuth.currentUser.uid);
  if(typeof wsSetActive==='function') wsSetActive('admin');
  if(typeof wsSetTitle==='function') wsSetTitle('🛡️ Admin Panel');
  loadOrders();
  loadTopups();
  loadChats();
  setTimeout(handleUrlAction, 1000);
}

// ===== HANDLE ACTION DARI URL DISCORD =====
async function handleUrlAction(){
  const urlParams = new URLSearchParams(window.location.search);
  const actionId = urlParams.get('id');
  const action = urlParams.get('action');
  if(!actionId || !action) return;

  console.log('🎯 Action from URL:', action, 'for ID:', actionId);
  const idNum = parseInt(actionId);

  if(action === 'selesai'){
    if(!confirm(`✅ Konfirmasi SELESAI untuk Order #${actionId.slice(-6)}?\n\nStatus order di web user bakal langsung berubah jadi SELESAI + muncul popup terima kasih.`)){ 
      window.history.replaceState({}, '', 'admin.html');
      return; 
    }
    try{
      await prosesSelesai(idNum);
      alert(`✅ Order #${actionId.slice(-6)} BERHASIL DISELESAIKAN!\n\nUser bakal dapet notif terima kasih di web mereka.`);
    }catch(e){
      alert('❌ Gagal: '+e.message);
    }
  } else if(action === 'batal'){
    const alasan = prompt(`❌ Alasan BATALKAN Order #${actionId.slice(-6)}?`, 'Dibatalkan admin');
    if(alasan === null){ 
      window.history.replaceState({}, '', 'admin.html');
      return; 
    }
    await prosesBatal(idNum, alasan || 'Dibatalkan admin');
    alert('❌ Order dibatalkan!');
  }
  window.history.replaceState({}, '', 'admin.html');
}

// ===== TAB SWITCH =====
function switchTab(tab, el){
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-orders').style.display = tab==='orders'?'block':'none';
  document.getElementById('tab-topup').style.display = tab==='topup'?'block':'none';
  document.getElementById('tab-chat').style.display = tab==='chat'?'block':'none';
}

// ===== LOAD ORDERS =====
function loadOrders(){
  const list = document.getElementById('listOrders');
  window.wafaOnValue(window.wafaRef(window.wafaDB, 'orders'), (snap)=>{
    const data = snap.val();
    list.innerHTML = '';
    if(!data){ list.innerHTML = '<div class="admin-card" style="text-align:center;color:#5a638a">📦 Belum ada order</div>'; updateStats(0, null, null, 0); return; }
    const orders = Object.values(data).sort((a,b)=>b.id-a.id);
    let aktif = 0;
    let totalHariIni = 0;
    const today = new Date().toLocaleDateString('id-ID');
    orders.forEach(o=>{
      if(o.status === 'verifikasi' || o.status === 'proses') aktif++;
      if(o.date && o.date.includes(today.split('/')[0])) totalHariIni += (o.total || 0);
    });
    updateStats(aktif, null, null, totalHariIni);
    
    orders.slice(0, 50).forEach(o=>{
      const color = o.status=='verifikasi'?'#ffcc00':o.status=='proses'?'#00e5ff':o.status=='selesai'?'#00ff88':'#ff4444';
      const card = document.createElement('div');
      card.className = 'admin-card';
      card.style.borderColor = color;
      let extra = '';
      if(o.method == 'gamepass' && o.gamepassLink) extra += `<br>🔗 Gamepass: <b style="word-break:break-all">${o.gamepassLink}</b>`;
      if(o.method == 'gift' && o.item) extra += `<br>🎁 Item: <b>${o.item}</b>`;
      if(o.metodeBayar == 'saldo') extra += `<br>💳 <b style="color:#00ff88">Dibayar via Saldo Web</b>`;
      
      let buktiBtn = o.bukti ? `<button class="btn-sm btn-proses" onclick="lihatBukti('${o.id}')">🖼️ Lihat Bukti</button>` : '';
      let actionBtns = '';
      if(o.status === 'verifikasi' || o.status === 'proses') {
        actionBtns = `<button class="btn-sm btn-done" onclick="prosesSelesai(${o.id})">✅ KONFIRMASI SELESAI</button>
                      <button class="btn-sm btn-batal" onclick="prosesBatal(${o.id}, 'Dibatalkan admin')">❌ BATALKAN</button>`;
      } else {
        actionBtns = `<button class="btn-sm btn-batal" onclick="hapusOrder(${o.id})">🗑️ Hapus</button>`;
      }
      
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <h3>📦 Order #${o.id.toString().slice(-6)}</h3>
            <div class="order-info">
              Username: <b>${o.username||'-'}</b><br>
              Jumlah: <b>${o.jumlah||0} Robux</b> | Total: <b style="color:#00ff88">Rp${(o.total||0).toLocaleString('id-ID')}</b><br>
              Metode: <b>${o.method||'-'}</b><br>
              Buyer: <b>${sensorEmail(o.email||'-')}</b> (${o.nickname||'-'})<br>
              UID: <b style="font-size:10px">${sensorUid(o.uid)}</b><br>
              📅 ${o.date||'-'}${extra}
            </div>
          </div>
          <span style="background:${color};color:#000;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800;white-space:nowrap">${(o.status||'').toUpperCase()}</span>
        </div>
        <div style="margin-top:10px">${buktiBtn}${actionBtns}</div>
      `;
      list.appendChild(card);
    });
  });
}

// ===== LIHAT BUKTI ORDER =====
window.lihatBukti = async (id)=>{
  const snap = await window.wafaGet(window.wafaRef(window.wafaDB, 'orders/'+id));
  const o = snap.val();
  if(!o || !o.bukti){ alert('Bukti tidak ada'); return; }
  const w = window.open('');
  w.document.write(`<html><head><title>Bukti TF</title><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}img{max-width:100%;max-height:100vh}</style></head><body><img src="${o.bukti}"></body></html>`);
};

// ===== PROSES SELESAI =====
window.prosesSelesai = async (id)=>{
  try{
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'orders/'+id), { status: 'selesai', selesaiAt: Date.now() });
    const snap = await window.wafaGet(window.wafaRef(window.wafaDB, 'orders/'+id));
    const o = snap.val();
    if(window.WEBHOOK_ORDER_DONE){
      fetch(window.WEBHOOK_ORDER_DONE, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ content: `✅ **ORDER SELESAI**\nID: #${id.toString().slice(-6)}\nBuyer: ${sensorEmail(o.email||'-')}\nUsername: ${o.username}\nJumlah: ${o.jumlah} Robux\nTotal: Rp${(o.total||0).toLocaleString('id-ID')}` })
      }).catch(e=>console.log('Discord err:', e));
    }
  }catch(e){ alert('Gagal: '+e.message); }
};

// ===== PROSES BATAL =====
window.prosesBatal = async (id, alasan)=>{
  try{
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'orders/'+id), { status: 'batal', batalReason: alasan, batalAt: Date.now() });
  }catch(e){ alert('Gagal: '+e.message); }
};

// ===== HAPUS ORDER =====
window.hapusOrder = async (id)=>{
  if(!confirm('Hapus order #'+id.toString().slice(-6)+'?')) return;
  try{
    await window.wafaRemove(window.wafaRef(window.wafaDB, 'orders/'+id));
  }catch(e){ alert('Gagal: '+e.message); }
};

// ===== LOAD TOPUP DOMPET =====
function loadTopups(){
  const list = document.getElementById('listTopup');
  window.wafaOnValue(window.wafaRef(window.wafaDB, 'topup_saldo'), (snap)=>{
    const data = snap.val();
    list.innerHTML = '';
    if(!data){ list.innerHTML = '<div class="admin-card" style="text-align:center;color:#5a638a">💰 Belum ada top up</div>'; updateStats(null, 0, null, null); return; }
    const topups = Object.values(data).sort((a,b)=>b.id-a.id);
    let pending = topups.filter(t=>t.status === 'verifikasi' || t.status === 'pending').length;
    updateStats(null, pending, null, null);
    
    topups.slice(0, 50).forEach(t=>{
      const color = t.status=='selesai'?'#00ff88':t.status=='batal'?'#ff4444':'#ffcc00';
      const card = document.createElement('div');
      card.className = 'admin-card';
      card.style.borderColor = color;
      let buktiBtn = t.bukti ? `<button class="btn-sm btn-proses" onclick="lihatBuktiTopup('${t.id}')">🖼️ Lihat Bukti</button>` : '';
      let actionBtns = '';
      if(t.status === 'verifikasi' || t.status === 'pending'){
        actionBtns = `<button class="btn-sm btn-done" onclick="approveTopup(${t.id})">✅ APPROVE - TAMBAH SALDO</button>
                      <button class="btn-sm btn-batal" onclick="rejectTopup(${t.id})">❌ TOLAK</button>`;
      } else {
        actionBtns = `<button class="btn-sm btn-batal" onclick="hapusTopup(${t.id})">🗑️ Hapus</button>`;
      }
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <h3>💰 Top Up #${t.id.toString().slice(-6)}</h3>
            <div class="order-info">
              Nominal: <b style="color:#00ff88">Rp${(t.nominal||t.jumlah||0).toLocaleString('id-ID')}</b><br>
              User: <b>${sensorEmail(t.email||'-')}</b> (${t.nickname||'-'})<br>
              UID: <b style="font-size:10px">${sensorUid(t.uid)}</b><br>
              📅 ${t.date||'-'}
            </div>
          </div>
          <span style="background:${color};color:#000;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800;white-space:nowrap">${(t.status||'pending').toUpperCase()}</span>
        </div>
        <div style="margin-top:10px">${buktiBtn}${actionBtns}</div>
      `;
      list.appendChild(card);
    });
  });
}

// ===== LIHAT BUKTI TOPUP =====
window.lihatBuktiTopup = async (id)=>{
  const snap = await window.wafaGet(window.wafaRef(window.wafaDB, 'topup_saldo/'+id));
  const t = snap.val();
  if(!t || !t.bukti){ alert('Bukti tidak ada'); return; }
  const w = window.open('');
  w.document.write(`<html><head><title>Bukti TF</title><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}img{max-width:100%;max-height:100vh}</style></head><body><img src="${t.bukti}"></body></html>`);
};

// ===== APPROVE TOPUP (TAMBAH SALDO OTOMATIS) =====
window.approveTopup = async (id)=>{
  if(!confirm('✅ APPROVE top up ini?\n\nSaldo user bakal otomatis ditambah.')) return;
  try{
    const snap = await window.wafaGet(window.wafaRef(window.wafaDB, 'topup_saldo/'+id));
    const t = snap.val();
    if(!t){ alert('Data ga ketemu'); return; }
    const nominal = t.nominal || t.jumlah || 0;
    const userSnap = await window.wafaGet(window.wafaRef(window.wafaDB, 'users/'+t.uid+'/saldo'));
    const saldoLama = userSnap.val() || 0;
    const saldoBaru = saldoLama + nominal;
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'users/'+t.uid), { saldo: saldoBaru });
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'topup_saldo/'+id), { status: 'selesai', approvedAt: Date.now() });
    if(window.WEBHOOK_DOMPET_DONE){
      fetch(window.WEBHOOK_DOMPET_DONE, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ content: `✅ **TOP UP DOMPET BERHASIL**\nID: #${id.toString().slice(-6)}\nUser: ${sensorEmail(t.email||'-')} (${t.nickname||'-'})\nNominal: Rp${nominal.toLocaleString('id-ID')}\nSaldo sekarang: Rp${saldoBaru.toLocaleString('id-ID')}` })
      }).catch(e=>console.log('Discord err:', e));
    }
    alert(`✅ Saldo Rp${nominal.toLocaleString('id-ID')} berhasil ditambah!`);
  }catch(e){ alert('Gagal approve: '+e.message); }
};

// ===== REJECT TOPUP =====

  try{
    await window.wafaUpdate(window.wafaRef(window.wafaDB, 'topup_saldo/'+id), { status: 'batal', batalReason: alasan });
  }catch(e){ alert('Gagal: '+e.message); }
};

window.hapusTopup = async (id)=>{
  if(!confirm('Hapus top up #'+id.toString().slice(-6)+'?')) return;
  try{
    await window.wafaRemove(window.wafaRef(window.wafaDB, 'topup_saldo/'+id));
  }catch(e){ alert('Gagal: '+e.message); }
};

let chatUnsubscribe = null;

    const data = snap.val();

    if(!data){ list.innerHTML = '<div class="admin-card" style="text-align:center;color:#5a638a">💬 Belum ada chat</div>'; updateStats(null, null, 0, null); return; }
    const uids = Object.keys(data);
    let totalChat = uids.length;
    updateStats(null, null, totalChat, null);
    
    const sorted = uids.map(uid=>{
      const msgs = Object.values(data[uid] || {}).sort((a,b)=>(b.time||0)-(a.time||0));
      const last = msgs[0] || {};
      const unreadCount = msgs.filter(m=>m.from === 'user' && !m.read).length;
      return { uid, last, unreadCount, msgCount: msgs.length };
    }).sort((a,b)=>(b.last.time||0)-(a.last.time||0));
    
    sorted.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'chat-list-item';
      card.onclick = ()=>bukaChat(item.uid);
      const time = item.last.time ? new Date(item.last.time).toLocaleString('id-ID', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'}) : '-';
      const preview = item.last.image ? '📸 Gambar' : (item.last.text || '(kosong)');
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="name">👤 ${item.last.nickname || sensorEmail(item.last.email || '-')}</div>
          ${item.unreadCount > 0 ? `<span class="badge-unread">${item.unreadCount}</span>` : ''}
        </div>
        <div class="preview">${preview}</div>
        <div class="time">${time} • ${item.msgCount} pesan</div>
      `;
      list.appendChild(card);
    });
  });
}

// ===== BUKA CHAT =====
window.bukaChat = async (uid)=>{
  currentChatUid = uid;
  document.getElementById('adminChatBox').style.display = 'flex';
  document.getElementById('listChat').style.display = 'none';
  
  const userSnap = await window.wafaGet(window.wafaRef(window.wafaDB, 'users/'+uid));
  const u = userSnap.val() || {};
  document.getElementById('adminChatName').innerText = `${u.nickname || 'User'} (${sensorEmail(u.email||'-')})`;
  
  if(chatUnsubscribe) chatUnsubscribe();
  chatUnsubscribe = window.wafaOnValue(window.wafaRef(window.wafaDB, 'chats/'+uid), (snap)=>{
    const data = snap.val() || {};
    const msgs = Object.entries(data).map(([k,v])=>({...v, _id:k})).sort((a,b)=>(a.time||0)-(b.time||0));
    const c = document.getElementById('adminChatMessages');
    c.innerHTML = '';
    if(msgs.length === 0){
      c.innerHTML = '<div class="msg bot">Belum ada pesan</div>';
    } else {
      msgs.forEach(m=>{
        const d = document.createElement('div');
        d.className = 'msg ' + (m.from === 'admin' ? 'user' : 'bot');
        if(m.image){
          d.innerHTML = `<img src="${m.image}" style="max-width:100%;border-radius:8px">`;
          if(m.text) d.innerHTML = m.text + '<br>' + d.innerHTML;
        } else {
          d.innerText = m.text || '';
        }
        c.appendChild(d);
      });
    }
    c.scrollTop = c.scrollHeight;
  });
};

// ===== TUTUP CHAT =====
window.closeAdminChat = ()=>{
  currentChatUid = null;
  if(chatUnsubscribe){ chatUnsubscribe(); chatUnsubscribe = null; }
  document.getElementById('adminChatBox').style.display = 'none';
  document.getElementById('listChat').style.display = 'block';
};

// ===== KIRIM BALASAN (TANPA NOTIF DISCORD) =====
window.kirimBalasan = async ()=>{
  if(!currentChatUid) return;
  const inp = document.getElementById('adminChatText');
  const t = inp.value.trim();
  if(!t) return;
  
  const msgId = Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const msgData = {
    from: 'admin',
    text: t,
    time: Date.now(),
    read: true
  };
  try{
    await window.wafaSet(window.wafaRef(window.wafaDB, 'chats/'+currentChatUid+'/'+msgId), msgData);
    inp.value = '';
  }catch(e){ alert('Gagal kirim: '+e.message); }
};

// ===== UPDATE STATISTIK =====
function updateStats(order, topup, chat, revenue){
  if(order !== null && order !== undefined) document.getElementById('statOrder').innerText = order;
  if(topup !== null && topup !== undefined) document.getElementById('statTopup').innerText = topup;
  if(chat !== null && chat !== undefined) document.getElementById('statChat').innerText = chat;
  if(revenue !== null && revenue !== undefined) document.getElementById('statToday').innerText = 'Rp' + revenue.toLocaleString('id-ID');
}
</script>
