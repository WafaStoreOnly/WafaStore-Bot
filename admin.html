<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin - WafaStoreOnly</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#060a23;color:#fff;padding:16px}.card{background:#121631;border:1px solid #232a5a;border-radius:14px;padding:16px;margin-bottom:12px}.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:800;cursor:pointer;margin-right:6px}.btn-proses{background:#00c6ff;color:#fff}.btn-done{background:#00ff88;color:#000}.btn-batal{background:#ff3b3b;color:#fff}</style></head>
<body>
<h2>Admin Panel WafaStoreOnly x Killua ⚡</h2><div id="status" style="margin:10px 0;color:#00ff88"></div><div id="list"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,get,update} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDTkQVpME0XRQmk9Jo7eDQuf0OFY8stm_8",authDomain:"wafastoreonly.firebaseapp.com",databaseURL:"https://wafastoreonly-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"wafastoreonly",appId:"1:208012194307:web:551a540b0151333da69436"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
// 4 WEBHOOK LU
const WEBHOOK_PROSES_ROBUX="https://discord.com/api/webhooks/1553218744803917856/QNkR8RlkR5Lo5u2R1kyR1U2qWeM_5a-1M3WEMR34R2vPfN-I2vPfR7YvR7YvR7YvR7";
const WEBHOOK_TOPUP_DONE="https://discord.com/api/webhooks/1553277385795829770/1qR8RlkR5Lo5u2R1kyR1U2qWeM_5a-1M3WEMR34R2vPfN-I2vPfR7YvR7YvR7YvR7";
const WEBHOOK_PROSES_DOMPET="https://discord.com/api/webhooks/1553275076332359782/Ndn9EePBTCJe7EWV4esTErBZZwrLGbBMj9kybncr8urHVnq4-ydeCWxl4Dp7kQgC9O64";
const WEBHOOK_DOMPET_DONE="https://discord.com/api/webhooks/1553275385666478120/snanzgqdkgovJomulzBGLueWdWX7Bnhp0ekS2reNuS8mLrPHLEMTrVS6nuMnE0t_0aXB";
// SENSOR
function sensorEmail(e){if(!e||!e.includes('@'))return'****';let [a,b]=e.split('@');return a.slice(0,3)+'****@'+b}
function sensorNomor(n){if(!n)return'****';let s=n.toString();if(s.length<7)return'****';return s.slice(0,4)+'****'+s.slice(-3)}

let urlParams=new URLSearchParams(window.location.search);
let actionId=urlParams.get('id');
let actionType=urlParams.get('type');
let action=urlParams.get('action');

async function handleAction(){
  if(!actionId||!actionType||!action)return;
  document.getElementById('status').innerText='Memproses ID #'+actionId+' '+action+'...';
  let path=actionType=='topup_saldo'?'topup_saldo/'+actionId:'orders/'+actionId;
  let snap=await get(ref(db,path));
  if(!snap.exists()){document.getElementById('status').innerText='Data tidak ditemukan!';return}
  let data=snap.val();
  if(action=='proses'){await update(ref(db,path),{status:'proses'});document.getElementById('status').innerText='✅ Status jadi PROSES #'+actionId;}
  if(action=='selesai'){
    if(actionType=='topup_saldo'){
      await update(ref(db,path),{status:'selesai'});
      let saldoSnap=await get(ref(db,'users/'+data.uid+'/saldo'));let saldoLama=saldoSnap.val()||0;
      await update(ref(db,'users/'+data.uid),{saldo:saldoLama+data.jumlah});
      // KIRIM KE CHANNEL DONE PAKE SENSOR
      await fetch(WEBHOOK_DOMPET_DONE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:`✅ **TOP UP DOMPET SELESAI - SALDO MASUK**\nID: #${actionId.toString().slice(-6)}\nUser: ${sensorEmail(data.email)} (${data.nickname||'-'})\nNominal: Rp${data.jumlah.toLocaleString('id-ID')}\nMethod: ${data.method}\nSaldo otomatis masuk!`})});
      document.getElementById('status').innerText='✅ Saldo Rp'+data.jumlah.toLocaleString('id-ID')+' masuk ke '+data.nickname;
    }else{
      await update(ref(db,path),{status:'selesai'});
      await fetch(WEBHOOK_TOPUP_DONE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:`✅ **ORDER ROBUX SELESAI**\nID: #${actionId.toString().slice(-6)}\nBuyer: ${sensorEmail(data.email)} (${data.nickname||'-'})\nRoblox: ${data.username}\nJumlah: ${data.jumlah} Robux\nTotal: Rp${(data.total||0).toLocaleString('id-ID')}`})});
      document.getElementById('status').innerText='✅ Robux selesai #'+actionId;
    }
  }
  if(action=='batal'){await update(ref(db,path),{status:'batal'});document.getElementById('status').innerText='❌ Dibatalkan #'+actionId;}
}
handleAction();

function render(){
  let listDiv=document.getElementById('list');listDiv.innerHTML='<h3>Semua Pesanan Terbaru:</h3>';
  onValue(ref(db,'orders'),(s)=>{
    let data=s.val();if(!data)return;
    Object.values(data).reverse().forEach(o=>{
      let div=document.createElement('div');div.className='card';
      div.innerHTML=`<b>ROBUX #${o.id.toString().slice(-6)}</b> - ${o.status}<br>Username: ${o.username}<br>Email: ${o.email} (${o.nickname||'-'})<br>Jumlah: ${o.jumlah} Robux - Rp${(o.total||0).toLocaleString('id-ID')}<br><small>${o.date}</small><br><br>
      <button class="btn btn-proses" onclick="updateStatus('orders/${o.id}','proses')">PROSES</button>
      <button class="btn btn-done" onclick="konfirmasiRobux('${o.id}')">KONFIRMASI</button>
      <button class="btn btn-batal" onclick="updateStatus('orders/${o.id}','batal')">BATAL</button>`;
      listDiv.appendChild(div);
    });
  });
  onValue(ref(db,'topup_saldo'),(s)=>{
    let data=s.val();if(!data)return;
    Object.values(data).reverse().forEach(o=>{
      let div=document.createElement('div');div.className='card';
      div.innerHTML=`<b>DOMPET #${o.id.toString().slice(-6)}</b> - ${o.status}<br>Email: ${o.email} (${o.nickname||'-'})<br>Nominal: Rp${o.jumlah.toLocaleString('id-ID')} via ${o.method}<br><small>${o.date}</small><br><br>
      <button class="btn btn-proses" onclick="updateStatus('topup_saldo/${o.id}','proses')">PROSES</button>
      <button class="btn btn-done" onclick="konfirmasiDompet('${o.id}')">KONFIRMASI</button>
      <button class="btn btn-batal" onclick="updateStatus('topup_saldo/${o.id}','batal')">BATAL</button>`;
      listDiv.appendChild(div);
    });
  });
}
window.updateStatus=async(path,st)=>{await update(ref(db,path),{status:st});alert('Status jadi '+st)};
window.konfirmasiDompet=async(id)=>{
  let snap=await get(ref(db,'topup_saldo/'+id));let data=snap.val();
  let saldoSnap=await get(ref(db,'users/'+data.uid+'/saldo'));let saldoLama=saldoSnap.val()||0;
  await update(ref(db,'users/'+data.uid),{saldo:saldoLama+data.jumlah});
  await update(ref(db,'topup_saldo/'+id),{status:'selesai'});
  await fetch(WEBHOOK_DOMPET_DONE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:`✅ **TOP UP DOMPET SELESAI**\nID: #${id.toString().slice(-6)}\nUser: ${sensorEmail(data.email)} (${data.nickname||'-'})\nNominal: Rp${data.jumlah.toLocaleString('id-ID')}\nMethod: ${data.method}`})});
  alert('Saldo masuk bos!');
};
window.konfirmasiRobux=async(id)=>{
  let snap=await get(ref(db,'orders/'+id));let data=snap.val();
  await update(ref(db,'orders/'+id),{status:'selesai'});
  await fetch(WEBHOOK_TOPUP_DONE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:`✅ **ROBUX SELESAI**\nID: #${id.toString().slice(-6)}\nBuyer: ${sensorEmail(data.email)} (${data.nickname||'-'})\nRoblox: ${data.username}\nJumlah: ${data.jumlah} Robux`})});
  alert('Robux selesai bos!');
};
render();
</script>
</body>
</html>
